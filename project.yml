# XcodeGen spec. Regenerate the Xcode project with: xcodegen generate
name: DesktopPet
options:
  bundleIdPrefix: com.nataliewiese
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: KX9UX7C7HK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.6"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DesktopPet:
    type: application
    platform: macOS
    sources:
      - DesktopPet
    entitlements:
      path: DesktopPet/DesktopPet.entitlements
      properties:
        # Hardened runtime blocks Calendar access without this (Reminders → Pull meetings).
        com.apple.security.personal-information.calendars: true
        # And blocks the mic without this (Clipboard → Record with sound from the mic).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nataliewiese.DesktopPet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Desktop Pet
        INFOPLIST_KEY_LSUIElement: YES # menu bar only, no Dock icon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Topsy reads today's meetings from your calendars to set reminders for them.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Topsy records your microphone in screen recordings when you turn on its sound.
        ENABLE_HARDENED_RUNTIME: YES
